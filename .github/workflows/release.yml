# The release pipeline: a v* tag assembles the release package (six
# cross-compiled binaries, archives, checksums, changelog) and publishes it
# as a GitHub Release. The gates run first — a release built on a red tree
# is not a release.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to release (defaults to the pushed ref)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is assembled from git history; a shallow clone
          # would produce an empty one. A dispatch names its tag: the train
          # fires the release this way because a tag pushed with a token
          # does not trigger workflows on its own.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gates (gofmt, vet, tests)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:" $unformatted; exit 1
          fi
          go vet ./...
          go test -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          # The secrets context is not readable in a step's if; the guard
          # lives here.
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN not set — skipping the tap update"
            exit 0
          fi
          git clone -q https://x-access-token:$TAP_TOKEN@github.com/crueber/homebrew-tap.git tap
          ./scripts/update-homebrew.sh "$GITHUB_REF_NAME" dist/checksums.txt tap
          cd tap
          git config user.name "coldstorage-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "coldstorage ${GITHUB_REF_NAME}"
          git push
